<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>HBK Quản lý</title>
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HBK Quản lý">
<style>
:root{--b:#0b3d91;--b2:#1565c0;--y:#ffb300;--bg:#f0f3f8;--t:#17212e;--m:#647487;--r:#d32f2f;--g:#2e7d32;--o:#ef6c00;--card:#fff;--ln:#e6ebf2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
header{background:linear-gradient(120deg,var(--b),var(--b2));color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:6}
header img{width:36px;height:36px;border-radius:9px;background:#fff}
header .ti{font-weight:700;font-size:17px;flex:1;min-width:0}header .ti small{display:block;font-weight:400;opacity:.85;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:9px;padding:8px 11px;font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.bar h2{flex:1;margin:0;font-size:19px}
.back{border:0;background:#fff;border-radius:10px;padding:9px 12px;font-size:15px;color:var(--b);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding:12px;max-width:780px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1;border:0;background:none;padding:7px 2px 8px;font-size:11.5px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bot button i{font-style:normal;font-size:21px;line-height:1.2}
nav.bot button.on{color:var(--b);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
h3{margin:0 0 10px;font-size:16px;color:var(--b)}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1;min-width:0}
label,.lb{display:block;font-size:13px;color:var(--m);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #d4dce7;border-radius:10px;font-size:16px;background:#fff;font-family:inherit;color:var(--t)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b2);box-shadow:0 0 0 3px rgba(21,101,192,.12)}
input[readonly]{background:#f4f6f9;color:var(--m)}
textarea{min-height:70px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:16.5px;font-weight:700;background:var(--b);color:#fff;margin-top:14px}
.btn.g{background:var(--g)}.btn.o{background:#fff;color:var(--b);border:1.5px solid var(--b)}.btn.sm{display:inline-block;width:auto;padding:10px 14px;font-size:14.5px;margin:0}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));background:var(--g);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
.it{padding:12px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.it:last-child{border:0}
.it b{display:block;font-size:16px}.mu{color:var(--m);font-size:13.5px}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:12px;background:#e3ecf9;color:var(--b);margin:4px 4px 0 0;font-weight:600}
.tag.r{background:#fde4e4;color:var(--r)}.tag.g{background:#e2f3e4;color:var(--g)}.tag.o{background:#fff0dd;color:var(--o)}.tag.x{background:#eceff3;color:var(--m)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi div{background:#f5f8fc;border-radius:12px;padding:11px}.kpi span{font-size:12.5px;color:var(--m)}.kpi b{display:block;font-size:19px;margin-top:2px}
.money{text-align:right;font-weight:700}.red{color:var(--r)}.grn{color:var(--g)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--ln)}
.chk .bx{display:flex;flex-direction:column;gap:8px;min-width:92px}
.chk label{margin:0;font-size:14px;color:var(--t);display:flex;gap:6px;align-items:center;font-weight:500}.chk input{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#263238;color:#fff;padding:13px 17px;border-radius:12px;max-width:92%;font-size:15px;display:none;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#load{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:8;font-weight:700;color:var(--b);font-size:17px}
.line{background:#f6f8fb;border-radius:12px;padding:10px;margin-top:10px}
.pre{white-space:pre-wrap;font-size:14px;background:#f6f8fb;border-radius:10px;padding:12px;word-break:break-word}
.login{max-width:400px;margin:50px auto}.login img{width:84px;display:block;margin:0 auto 12px;border-radius:18px}
.seg{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}.seg button{flex:0 0 auto;padding:9px 13px;border:1.5px solid #d4dce7;background:#fff;border-radius:20px;font-size:14px;color:var(--t)}.seg button.on{background:var(--b);color:#fff;border-color:var(--b)}
.grp{font-size:13px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.4px;margin:18px 2px 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:14px;padding:12px 8px 10px;text-align:center;box-shadow:0 1px 3px rgba(16,24,40,.07);position:relative;cursor:pointer;min-height:96px}
.tile .e{font-size:28px;display:block}.tile .n{font-size:13.5px;font-weight:600;display:block;margin-top:4px;line-height:1.25}.tile .s{font-size:11.5px;color:var(--m);display:block;margin-top:3px}
.tile .bd{position:absolute;top:6px;right:6px;background:var(--r);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{border:0;border-radius:14px;background:#fff;padding:13px 6px;font-size:14px;font-weight:700;color:var(--b);box-shadow:0 1px 3px rgba(16,24,40,.07)}
.quick button i{display:block;font-style:normal;font-size:22px;margin-bottom:3px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--ln);font-size:15px;cursor:pointer}.alert:last-child{border:0}.alert i{font-style:normal;font-size:20px}
.dv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.dv:last-child{border:0}
.dv .k{flex:0 0 42%;color:var(--m);font-size:14px}.dv .v{flex:1;font-size:15px;word-break:break-word;font-weight:500}
.dv .v a{color:var(--b2)}
.warn{background:#fff4f4;border:1px solid #f6caca;color:var(--r);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:6px}
.okk{background:#eef8ef;color:var(--g);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:6px;font-weight:600}
.cardi{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,40,.07);border-left:5px solid #cfd8e3;cursor:pointer}
.cardi.g{border-left-color:var(--g)}.cardi.r{border-left-color:var(--r)}.cardi.o{border-left-color:var(--o)}.cardi.b{border-left-color:var(--b2)}
.cardi b{font-size:16px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}.chips span{font-size:13.5px;color:var(--m)}.chips span em{font-style:normal;color:var(--t);font-weight:600}
.tbl{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.tbl table{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;vertical-align:top}
.tbl tr td:first-child{position:sticky;left:0;background:#fff;font-weight:600;max-width:200px;white-space:normal}
.tbl tr.hd td{background:#eef3fa;color:var(--b);font-weight:700}
.sec{font-size:13px;font-weight:700;color:var(--b);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.3px}
.empty{text-align:center;color:var(--m);padding:30px 10px}
.cnt{font-size:13.5px;color:var(--m);margin:-4px 2px 8px}
</style></head><body>
<div id="app"></div><div id="toast"></div><div id="load">Đang xử lý...</div>
<script>
const API='https://script.google.com/macros/s/AKfycbwpB74z69gn_UowOD46V_sX2y0TNZKdnBwMirVEyGZBPEz6LLwD6Pm-FkJRNVJaG_8VKw/exec';
let S={tok:null,meta:null,tab:null,home:null};
try{S.tok=localStorage.getItem('qlTok')}catch(e){}
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vnd=n=>(Math.round(Number(n)||0)).toLocaleString('vi-VN');
const dd=s=>s?String(s).split('-').reverse().join('/'):'';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',4200)}
async function call(fn,args={},quiet){
  if(!quiet)$('#load').style.display='flex';
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({fn,token:S.tok},args))});
    const j=await r.json(); if(!j.ok){if(j.error==='PHIEN_HET_HAN'){logout();throw new Error('Phiên đăng nhập hết hạn, đăng nhập lại.')}throw new Error(j.error)} return j.data;}
  finally{$('#load').style.display='none'}
}
function logout(){S.tok=null;try{localStorage.removeItem('qlTok')}catch(e){}loginView()}
async function loginView(){
  app.innerHTML=`<div class="login card"><img src="../icon-192.png"><h3 style="text-align:center;font-size:18px">HBK GLOBAL · APP QUẢN LÝ</h3>
  <label>Họ tên</label><select id="ten"><option>Đang tải...</option></select><label>Mã PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="4 số">
  <button class="btn" id="go">Đăng nhập</button></div>`;
  try{const ds=await call('nhanvien',{},true);$('#ten').innerHTML=ds.map(n=>`<option>${esc(n)}</option>`).join('');
    try{const l=localStorage.getItem('qlTen');if(l)$('#ten').value=l}catch(e){}}catch(e){toast(e.message)}
  const go=async()=>{try{const r=await call('login',{ten:$('#ten').value,pin:$('#pin').value});S.tok=r.token;try{localStorage.setItem('qlTok',r.token);localStorage.setItem('qlTen',r.ten)}catch(e){}start()}catch(e){toast(e.message)}};
  $('#go').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};
}
const has=k=>S.meta&&S.meta.quyen.includes(k);
async function start(){
  try{S.meta=await call('meta')}catch(e){toast(e.message);return}
  const nav=[['home','🏠','Trang chủ']];
  if(has('don')||has('don_xem'))nav.push(['don','🧾','Đơn hàng']);
  if(has('chuyen'))nav.push(['chuyen','🚚','Xếp chuyến']);
  if(has('quy'))nav.push(['quy','💰','Quỹ']);else if(has('hoadon'))nav.push(['hoadon','📄','Hóa đơn']);
  nav.push(['all','☰','Tất cả']);
  app.innerHTML=`<header><img src="../icon-192.png"><div class="ti">HBK Quản lý<small>${esc(S.meta.user.ten)} · ${esc(S.meta.user.role)}</small></div><button id="rf" title="Tải lại">↻</button><button id="out">Thoát</button></header>
  <main id="m"></main><nav class="bot">${nav.map(t=>`<button data-t="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</nav>`;
  $('#out').onclick=()=>{if(confirm('Đăng xuất khỏi app?'))logout()};
  $('#rf').onclick=()=>{S.home=null;go(S.tab||'home')};
  document.querySelectorAll('nav.bot button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  go('home');
}
const NAVK={home:'home',all:'all',don:'don',chuyen:'chuyen',quy:'quy',hoadon:'hoadon'};
function go(t,arg){
  S.tab=t;window.scrollTo(0,0);
  const nk=NAVK[t]||(t==='hopdong'?'all':'all');
  document.querySelectorAll('nav.bot button').forEach(b=>b.classList.toggle('on',b.dataset.t===nk));
  const fab=document.querySelector('.fab');if(fab)fab.remove();
  if(t.startsWith('b:'))return vBang(t.slice(2),arg);
  ({home:vHome,all:vAll,don:vDon,chuyen:vChuyen,hoadon:vHoaDon,quy:vQuy,hopdong:vHopDong})[t](arg);
}
const M=()=>$('#m');
const opts=(a,v,blank)=>(blank?'<option value=""></option>':'')+a.map(x=>`<option${String(x).trim()===String(v==null?'':v).trim()?' selected':''}>${esc(x)}</option>`).join('');
const head=(t,back)=>`<div class="bar">${back?`<button class="back" onclick="${back}">←</button>`:''}<h2>${esc(t)}</h2></div>`;
/* ---------- TRANG CHỦ ---------- */
const CUSTOM=[['don','🧾','Đơn hàng & nhập đơn','Bán hàng',()=>has('don')||has('don_xem')],['hoadon','📄','Hóa đơn VAT','Bán hàng',()=>has('hoadon')],['hopdong','📝','Hợp đồng','Bán hàng',()=>has('hopdong')],
  ['chuyen','🚚','Xếp chuyến','Giao lắp',()=>has('chuyen')],['quy','💰','Quỹ & thu chi','Tài chính',()=>has('quy')]];
async function loadHome(){if(!S.home)S.home=await call('home',{},true);return S.home}
const baseHome=()=>S.home||(S.meta.bangs||[]).map(b=>Object.assign({n:'…',can:0,bao:''},b));
async function vHome(){
  const h=new Date().getHours(),chao=h<11?'Chào buổi sáng':h<14?'Chào buổi trưa':h<18?'Chào buổi chiều':'Chào buổi tối';
  M().innerHTML=`<div class="mu" style="margin:2px 2px 10px;font-size:15px">${chao}, <b style="display:inline;color:var(--t)">${esc(S.meta.user.ten.split(' ').pop())}</b></div>
  <div id="hk"></div><div class="quick">${has('don')?'<button id="q1"><i>➕</i>Đơn mới</button>':''}${has('chuyen')?'<button id="q2"><i>🚚</i>Xếp chuyến</button>':''}${has('quy')?'<button id="q3"><i>💸</i>Ghi thu/chi</button>':''}${!has('don')&&has('hoadon')?'<button id="q4"><i>📄</i>Hóa đơn</button>':''}</div>
  <div class="card" style="margin-top:12px" id="ha"><h3>Việc cần chú ý</h3><div class="mu">Đang kiểm tra dữ liệu...</div></div><div id="ht">${tilesHtml(baseHome())}</div>`;bindTiles();
  if($('#q1'))$('#q1').onclick=()=>{go('don');setTimeout(()=>donForm(null),0)};
  if($('#q2'))$('#q2').onclick=()=>go('chuyen');
  if($('#q3'))$('#q3').onclick=async()=>{go('quy')};
  if($('#q4'))$('#q4').onclick=()=>go('hoadon');
  if(has('quy'))call('tongQuan',{},true).then(t=>{S.tq=t;$('#hk')&&($('#hk').innerHTML=`<div class="card"><h3>Tiền hôm nay</h3><div class="kpi"><div><span>Tổng tiền các quỹ</span><b class="grn">${vnd(t.tong)}</b></div><div><span>Tiền mặt</span><b>${vnd(t.tm)}</b></div><div><span>Vietcombank</span><b>${vnd(t.vcb)}</b></div><div><span>MBBank</span><b>${vnd(t.mb)}</b></div><div><span>Thu hôm nay</span><b class="grn">+${vnd(t.thu)}</b></div><div><span>Chi hôm nay</span><b class="red">-${vnd(t.chi)}</b></div><div><span>Khách còn nợ</span><b class="red">${vnd(t.khachNo)}</b></div><div><span>Doanh số tháng</span><b>${vnd(t.dsThang)}</b></div></div></div>`)}).catch(()=>{});
  let hm=[];try{hm=await loadHome()}catch(e){toast(e.message)}
  if(!$('#ha')||S.tab!=='home')return;
  const al=[];
  hm.forEach(o=>{if(o.can)al.push([o.k,'⚠️',`${o.ten}: ${o.can} dòng thiếu dữ liệu`]);const n=parseInt(o.bao);if(n>0)al.push([o.k,o.ic,`${o.ten}: ${o.bao}`])});
  $('#ha').innerHTML='<h3>Việc cần chú ý</h3>'+(al.length?al.map(a=>`<div class="alert" data-k="${a[0]}"><i>${a[1]}</i><div style="flex:1">${esc(a[2])}</div><span class="mu">›</span></div>`).join(''):'<div class="okk">✓ Không có việc tồn đọng</div>');
  document.querySelectorAll('#ha .alert').forEach(x=>x.onclick=()=>go('b:'+x.dataset.k,{canh:1}));
  $('#ht').innerHTML=tilesHtml(hm);bindTiles();
}
function tilesHtml(hm){
  const groups={};const add=(g,h)=>{(groups[g]=groups[g]||[]).push(h)};
  CUSTOM.forEach(c=>{if(c[4]())add(c[3],`<div class="tile" data-go="${c[0]}"><span class="e">${c[1]}</span><span class="n">${c[2]}</span></div>`)});
  hm.forEach(o=>add(o.nhom,`<div class="tile" data-go="b:${o.k}"><span class="e">${o.ic}</span><span class="n">${esc(o.ten)}</span><span class="s">${o.bc?'Báo cáo':o.n+' dòng'}${o.q==='r'?' · xem':''}</span>${o.can?`<span class="bd">${o.can}</span>`:''}</div>`));
  return ['Bán hàng','Giao lắp','Kho & mua hàng','Tài chính','Nhân sự'].filter(g=>groups[g]).map(g=>`<div class="grp">${g}</div><div class="tiles">${groups[g].join('')}</div>`).join('');
}
function bindTiles(){document.querySelectorAll('.tile').forEach(x=>x.onclick=()=>go(x.dataset.go))}
async function vAll(){
  M().innerHTML=head('Tất cả chức năng')+`<div id="ht">${tilesHtml(baseHome())}</div>`;bindTiles();
  let hm=[];try{hm=await loadHome()}catch(e){toast(e.message)}if(!$('#ht')||S.tab!=='all')return;
  $('#ht').innerHTML=tilesHtml(hm)+`<div class="card mu" style="margin-top:16px">Số đỏ trên ô = số dòng còn thiếu dữ liệu. Mọi thay đổi trong app ghi thẳng vào file Quản lý HBK.</div>`;bindTiles();
}
/* ---------- TRANG CHUNG (mọi trang trong file) ---------- */
const stCls=s=>{s=String(s||'');if(/Hủy|Không mua|Quá hạn|Sắp hết|Hết bảo hành|Chưa xử lý|Chưa làm/.test(s))return 'r';if(/Xong|Đã thu đủ|Đã chốt|Đã lắp|Đủ|Đang làm việc|Trong bảo hành|^Thu$/.test(s))return 'g';if(/Đang|Chờ|Đã xếp|Chi$/.test(s))return 'o';return s?'b':''};
const isCan=v=>String(v||'').indexOf('Cần')===0;
async function vBang(k,arg){
  arg=arg||{};
  M().innerHTML=head('Đang tải...',"go('home')")+'<div class="card mu">Đang tải dữ liệu...</div>';
  let B;try{B=await call('bang',{k},true)}catch(e){M().innerHTML=head('Lỗi',"go('home')")+`<div class="card">${esc(e.message)}</div>`;return}
  S.B=B;
  if(B.bc)return drawBC(B);
  drawList(B,arg.canh?'__can':'',arg.q||'');
}
function drawBC(B){
  const rows=B.rows,two=rows.every(r=>r.length<=3);
  if(two){
    M().innerHTML=head(B.ten,"go('home')")+'<div class="card">'+rows.map(r=>r.length===1||!String(r[1]||'').trim()?`<div class="sec">${esc(r[0])}</div>`:`<div class="dv"><div class="k">${esc(r[0])}</div><div class="v">${esc(r.slice(1).join(' · '))}</div></div>`).join('')+'</div>';
  }else{
    const w=Math.max(...rows.map(r=>r.length));

function fmtV(c,v){
  v=String(v==null?'':v);if(!v.trim())return '<span class="mu">—</span>';

  if(/SĐT/.test(c.ten)&&/^0\d{8,10}$/.test(v.trim()))return `<a href="tel:${esc(v.trim())}">📞 ${esc(v)}</a>`;
  if(c.loai==='kt')return isCan(v)?`<span class="red">${esc(v)}</span>`:`<span class="grn">${esc(v)}</span>`;
  return esc(v).replace(/\n/g,'<br>')+(c.loai==='tien'&&/\d/.test(v)?' đ':'');
}

}
/* ---------- HÓA ĐƠN ---------- */
async function vHoaDon(mode){
  mode=mode||'chua';
  M().innerHTML=head('Hóa đơn VAT')+`<div class="seg"><button id="h1" class="${mode==='chua'?'on':''}">Chưa xuất HĐ</button><button id="h2" class="${mode==='roi'?'on':''}">Đã xuất HĐ</button></div><input id="hq" placeholder="Tìm khách, mã đơn..."><div id="hl" class="card" style="margin-top:8px">Đang tải...</div>`;
  $('#h1').onclick=()=>vHoaDon('chua');$('#h2').onclick=()=>vHoaDon('roi');
  let ds=[];try{ds=await call('listHoaDon',{},true)}catch(e){return toast(e.message)}
  const draw=()=>{const k=$('#hq').value.toLowerCase();const f=ds.filter(o=>(mode==='chua'?!o.so:!!o.so)&&(!k||(o.ma+o.khach).toLowerCase().includes(k)));
    $('#hl').innerHTML=f.length?f.map((o,i)=>`<div class="it" data-i="${ds.indexOf(o)}"><b>${esc(o.ma)} · ${esc(o.ten||o.khach)}</b><span class="tag">${esc(o.tt)}</span>${o.mst?'':'<span class="tag o">Chưa có MST</span>'}${o.so?`<span class="tag g">HĐ ${esc(o.so)}</span>`:''}<div class="mu">Ngày chốt ${dd(o.ngay)} · Tổng ${vnd(o.tien)} đ</div></div>`).join(''):'Không có đơn.';
    document.querySelectorAll('#hl .it').forEach(x=>x.onclick=()=>hdForm(ds[x.dataset.i],mode))};
  $('#hq').oninput=draw;draw();
}
function hdForm(o,mode){
  const txt=`Tên: ${o.ten||o.khach}\nMST/CCCD: ${o.mst}\nĐịa chỉ: ${o.dchd||o.dc}\nEmail: ${o.email}\n`+o.may.map(m=>`- ${m.ten} x${m.sl}: ${vnd(m.gia)} đ/bộ = ${vnd(m.tien)} đ`).join('\n')+`\nTổng cộng (đã gồm VAT): ${vnd(o.tien)} đ`;
  M().innerHTML=`<button class="btn o sm" id="hb">← Danh sách</button><div class="card"><h3>Hóa đơn đơn ${esc(o.ma)}</h3><div class="mu">${esc(o.khach)} · ${esc(o.sdt)} · ${esc(o.tt)}</div>
  <label>Tên xuất hóa đơn (công ty / cá nhân)</label><input id="ht1" value="${esc(o.ten||o.khach)}"><label>Mã số thuế / CCCD</label><input id="ht2" inputmode="numeric" value="${esc(o.mst)}">
  <label>Địa chỉ xuất hóa đơn</label><input id="ht3" value="${esc(o.dchd||o.dc)}"><label>Email nhận hóa đơn</label><input id="ht4" type="email" value="${esc(o.email)}">
  <label>Số hóa đơn VAT đã xuất (MISA)</label><input id="ht5" value="${esc(o.so)}" placeholder="Để trống nếu chưa xuất">
  <button class="btn g" id="hs">LƯU</button></div><div class="card"><h3>Nội dung để nhập MISA</h3><div class="pre" id="hp">${esc(txt)}</div><button class="btn o" id="hc">Sao chép</button></div>`;
  $('#hb').onclick=()=>vHoaDon(mode);
  $('#hc').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('#hp').textContent).then(()=>toast('Đã sao chép'),()=>toast('Không sao chép được, giữ lâu để chọn'))};
  $('#hs').onclick=async()=>{try{const r=await call('saveHoaDon',{hd:{ma:o.ma,ten:$('#ht1').value,mst:$('#ht2').value,dchd:$('#ht3').value,email:$('#ht4').value,so:$('#ht5').value}});toast(r.msg);vHoaDon(mode)}catch(e){toast(e.message)}};
}
/* ---------- QUỸ ---------- */
async function vQuy(){
  M().innerHTML='<div class="card">Đang tải...</div>';
  let t;try{t=await call('tongQuan',{},true)}catch(e){return M().innerHTML=`<div class="card">${esc(e.message)}</div>`}
  drawQuy(t);
}
function drawQuy(t,f){
  f=f||'';
  const gd=t.gd.filter(g=>!f||g.quy===f||g.quyNhan===f);
  M().innerHTML=head('Quỹ & thu chi')+`<div class="card"><h3>Số dư quỹ hôm nay</h3><div class="kpi"><div><span>Tiền mặt</span><b>${vnd(t.tm)}</b></div><div><span>Vietcombank</span><b>${vnd(t.vcb)}</b></div><div><span>MBBank</span><b>${vnd(t.mb)}</b></div><div><span>Tổng tiền</span><b class="grn">${vnd(t.tong)}</b></div></div>
  <div class="kpi" style="margin-top:8px"><div><span>Thu hôm nay</span><b class="grn">${vnd(t.thu)}</b></div><div><span>Chi hôm nay</span><b class="red">${vnd(t.chi)}</b></div></div></div>
  <div class="card"><h3>Kinh doanh & công nợ</h3><div class="kpi"><div><span>Doanh số tháng (${t.donThang} đơn)</span><b>${vnd(t.dsThang)}</b></div><div><span>Hôm nay (${t.donNgay} đơn)</span><b>${vnd(t.dsNgay)}</b></div><div><span>Khách còn nợ</span><b class="red">${vnd(t.khachNo)}</b></div><div><span>Nợ nhà cung cấp</span><b>${vnd(t.nccNo)}</b></div><div><span>HH CTV đến hạn trả</span><b>${vnd(t.hhPhaiTra)}</b></div><div><span>Đơn nợ quá hạn</span><b>${t.quaHan}</b></div></div></div>
  <button class="btn g" id="addtc">+ Ghi thu / chi</button>
  <div class="card" style="margin-top:10px"><h3>Biến động số dư gần đây</h3><div class="seg">${['','Tiền mặt','NH Vietcombank','NH MBBank'].map(q=>`<button data-q="${q}" class="${q===f?'on':''}">${q?q.replace('NH ',''):'Tất cả'}</button>`).join('')}</div>
  ${gd.map(g=>`<div class="it"><div class="row"><div><b>${esc(g.khoan)}</b><div class="mu">${dd(g.ngay)} · ${esc(g.quy)}${g.quyNhan?' → '+esc(g.quyNhan):''}${g.ma?' · '+esc(g.ma):''}${g.ncc?' · '+esc(g.ncc):''}</div><div class="mu">${esc(g.dg||'')} ${g.nguoi?'· '+esc(g.nguoi):''}</div></div><div class="money ${g.loai==='Thu'?'grn':g.loai==='Chi'?'red':''}" style="flex:0 0 auto">${g.loai==='Thu'?'+':g.loai==='Chi'?'-':''}${vnd(g.tien)}</div></div></div>`).join('')||'Chưa có giao dịch.'}</div>`;
  $('#addtc').onclick=()=>tcForm(t);
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>drawQuy(t,b.dataset.q));if(S.tq!==t)S.tq=t;
}
function tcForm(t){
  M().innerHTML=`<button class="btn o sm" id="tb">← Quỹ</button><div class="card"><h3>Ghi thu / chi</h3>
  <div class="row"><div><label>Ngày</label><input id="t1" type="date" value="${S.meta.homnay}"></div><div><label>Quỹ</label><select id="t3">${opts(S.meta.quy,'',1)}</select></div></div>
  <label>Khoản mục</label><select id="t2">${opts(S.meta.khoan,'',1)}</select><label>Số tiền (đ)</label><input id="t4" inputmode="numeric">
  <div id="tx"></div><label>Diễn giải</label><input id="t8"></div><button class="btn g" id="ts">LƯU</button>`;
  $('#tb').onclick=()=>drawQuy(t);
  const ex=()=>{const k=$('#t2').value;let h='';
    if(/khách|bảo hành/i.test(k))h+=`<label>Mã đơn</label><input id="t5" placeholder="VD: MD012">`;
    if(/nhà cung cấp/i.test(k))h+=`<label>Nhà cung cấp</label><select id="t6">${opts(S.meta.ncc,'',1)}</select>`;
    if(/chuyến xe|ETC/i.test(k))h+=`<label>Mã chuyến xe</label><select id="t7">${opts(S.meta.chuyen,'',1)}</select>`;
    if(/nội bộ/i.test(k))h+=`<label>Quỹ nhận</label><select id="t9">${opts(S.meta.quy,'',1)}</select>`;
    $('#tx').innerHTML=h};
  $('#t2').onchange=ex;
  $('#t4').oninput=e=>{const n=e.target.value.replace(/\D/g,'');e.target.value=n?Number(n).toLocaleString('vi-VN'):''};
  $('#ts').onclick=async()=>{const v=id=>$('#'+id)?$('#'+id).value:'';
    try{const r=await call('addThuChi',{tc:{ngay:v('t1'),khoan:v('t2'),quy:v('t3'),tien:v('t4'),ma:v('t5'),ncc:v('t6'),mc:v('t7'),dg:v('t8'),quyNhan:v('t9')}});toast(r.msg);drawQuy(r.tq)}catch(e){toast(e.message)}};
}
/* ---------- HỢP ĐỒNG ---------- */
function vHopDong(){M().innerHTML=head('Hợp đồng',"go('home')")+`<div class="card"><h3>Tạo hợp đồng</h3><div class="mu">Mục này đang hoàn thiện: chọn đơn → app tự tạo Hợp đồng + Phụ biểu linh kiện + Biên bản nghiệm thu theo mẫu của công ty.</div></div>`}
if(S.tok)start();else loginView();
</script></body></html>
